.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chip .n{font-size:.72rem;color:var(--ink-faint);font-variant-numeric:tabular-nums}
article{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:1.15rem 1.25rem;margin-bottom:.8rem}
article h2{font-size:1.02rem;font-weight:600;margin:0 0 .5rem;line-height:1.45;text-wrap:balance}
article h2 a{color:var(--ink);text-decoration:none;border-bottom:1px solid transparent}
article h2 a:hover{border-bottom-color:var(--accent)}
.tldr{border-left:3px solid var(--accent);padding-left:.75rem;margin:0 0 .6rem;
  color:var(--ink);font-size:.93rem}
.bib{color:var(--ink-faint);font-size:.78rem;display:flex;flex-wrap:wrap;gap:.5rem;
  align-items:center;margin-top:.5rem}
.bib .tag{background:var(--accent-soft);color:var(--accent);padding:.1rem .45rem;border-radius:4px;
  font-size:.72rem;font-weight:500}
.oa{color:var(--mark);font-weight:500}
details summary{cursor:pointer;color:var(--ink-soft);font-size:.82rem;margin-top:.55rem;
  list-style:none;user-select:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"▸ ";color:var(--ink-faint)}
details[open] summary::before{content:"▾ "}
details p{font-size:.86rem;color:var(--ink-soft);margin:.55rem 0 0;
  max-height:26rem;overflow:auto}
details details{margin:.6rem 0 0;padding-left:.2rem}
details details summary{font-size:.78rem;color:var(--ink-faint)}
details details p{font-size:.82rem;max-height:20rem}
.loading{font-size:.82rem;color:var(--ink-faint);margin:.55rem 0 0}
footer{margin-top:3rem;padding-top:1.25rem;border-top:1px solid var(--line);
  color:var(--ink-faint);font-size:.78rem}
a{color:var(--accent)}
@media (max-width:480px){h1{font-size:1.6rem} .wrap{padding-top:1.75rem}}

<div class="chips"><button class="chip" data-topic="" aria-pressed="true">전체<span class="n">1027</span></button><button class="chip" data-topic="world-models">세계모델<span class="n">555</span></button><button class="chip" data-topic="spatial-ai">공간 AI<span class="n">114</span></button><button class="chip" data-topic="clonal-plant-modeling">클론식물 모델링<span class="n">97</span></button><button class="chip" data-topic="plant-3d-reconstruction">식물 3D 재구성<span class="n">84</span></button><button class="chip" data-topic="plant-digital-twin">식물 디지털트윈<span class="n">54</span></button><button class="chip" data-topic="functional-structural-plant">기능구조 식물모델<span class="n">44</span></button><button class="chip" data-topic="construction-bim">건설 BIM<span class="n">36</span></button><button class="chip" data-topic="agent-based-ecology">행위자기반 생태<span class="n">31</span></button><button class="chip" data-topic="landscape-bim">조경 BIM<span class="n">12</span></button></div>

<p class="research-source-notice">arXiv와 OpenAlex 공개 메타데이터로 만들었습니다. 저작권은 각 논문 저작자와 출판사에 있습니다.</p>

<script>
const TOPIC_LABEL = {"clonal-plant-modeling": "클론식물 모델링", "functional-structural-plant": "기능구조 식물모델", "plant-3d-reconstruction": "식물 3D 재구성", "world-models": "세계모델", "agent-based-ecology": "행위자기반 생태", "landscape-bim": "조경 BIM", "plant-digital-twin": "식물 디지털트윈", "construction-bim": "건설 BIM", "spatial-ai": "공간 AI"};
let PAPERS = [], filter = "";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function card(p) {
  const authors = Array.isArray(p.authors) ? p.authors.join(", ") : (p.authors || "");
  const link = p.url || p.doi || "#";
  return `<article>
    <h2><a href="${esc(link)}" target="_blank" rel="noopener">${esc(p.title)}</a></h2>
    ${p.tldr ? `<p class="tldr">${esc(p.tldr)}</p>` : ""}
    <div class="bib">
      <span class="tag">${esc(TOPIC_LABEL[p.topic] || p.topic || "")}</span>
      ${p.venue ? `<span>${esc(p.venue)}</span>` : ""}
      ${p.published ? `<span>${esc(String(p.published).slice(0,10))}</span>` : ""}
      ${p.oa ? `<span class="oa">오픈액세스</span>` : ""}
      ${p.pdf_url ? `<a href="${esc(p.pdf_url)}" target="_blank" rel="noopener">원문 PDF</a>` : ""}
    </div>
    ${authors ? `<div class="bib">${esc(authors)}</div>` : ""}
    <details data-id="${esc(p.id)}"><summary>초록</summary>
      <p class="loading">불러오는 중…</p></details>
  </article>`;
}

// 초록 전문은 전체 용량의 79%라 따로 둔다. 처음 펼칠 때 한 번만 받아 전부 채운다.
let ABS = null, absPending = null;
function loadAbstracts() {
  if (ABS) return Promise.resolve(ABS);
  if (!absPending) absPending = fetch("abstracts.json").then(r => r.json()).then(d => (ABS = d));
  return absPending;
}
function fillAbstract(det) {
  if (det.dataset.filled) return;
  det.dataset.filled = "1";
  loadAbstracts().then(all => {
    const a = all[det.dataset.id] || {};
    const ko = a.summary_ko, en = a.summary;
    if (!ko && !en) { det.querySelector("p").textContent = "초록이 없는 논문입니다."; return; }
    det.querySelector("p").outerHTML =
      (ko ? `<p>${esc(ko)}</p>` : "") +
      (en ? `<details><summary>${ko ? "원문 초록 (English)" : "초록 (English)"}</summary>
             <p>${esc(en)}</p></details>` : "");
  }).catch(() => {
    det.dataset.filled = "";
    const p = det.querySelector("p");
    if (p) p.textContent = "초록을 불러오지 못했습니다.";
  });
}
document.addEventListener("toggle", ev => {
  const d = ev.target;
  if (d.tagName === "DETAILS" && d.open && d.dataset.id) fillAbstract(d);
}, true);
function draw() {
  const rows = filter ? PAPERS.filter(p => p.topic === filter) : PAPERS;
  document.getElementById("list").innerHTML = rows.slice(0, 400).map(card).join("") ||
    `<article><p>해당 주제의 논문이 아직 없습니다.</p></article>`;
}
// 테마: 밝게/어둡게는 root에 data-theme을 찍고, 자동은 지워서 OS 설정을 따른다.
const themeBtns = document.querySelectorAll(".theme button");
function setTheme(mode, save) {
  if (mode === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", mode);
  themeBtns.forEach(b => b.setAttribute("aria-pressed", b.dataset.theme === mode));
  if (save) { try { localStorage.setItem("theme", mode); } catch (e) {} }
}
themeBtns.forEach(b => b.addEventListener("click", () => setTheme(b.dataset.theme, true)));
// 기본은 밝게. '자동'을 고르면 그때부터 OS 설정을 따른다.
let saved = "light";
try { saved = localStorage.getItem("theme") || "light"; } catch (e) {}
setTheme(saved, false);

document.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
  filter = b.dataset.topic;
  document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === b));
  draw();
}));
fetch("papers.json").then(r => r.json()).then(d => { PAPERS = d.papers; draw(); })
  .catch(() => { document.getElementById("list").innerHTML =
    `<article><p>목록을 불러오지 못했습니다.</p></article>`; });
</script>
