<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 365" width="360" height="365" role="img" aria-labelledby="title desc">
<title id="title">직선거리: 200m</title>
<desc id="desc">출발점과 공원 출입구 사이 직선거리는 200m입니다. 직선은 연못을 가로지르므로 보행 가능한 길이 아닙니다.</desc>
