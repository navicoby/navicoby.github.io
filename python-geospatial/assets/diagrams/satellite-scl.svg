<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" width="360" height="340" role="img" aria-labelledby="title desc">
<title id="title">02 · SCL 격자 맞추기</title>
<desc id="desc">20m SCL의 4·9·5·6 분류를 10m 기준 격자에 nearest로 맞춥니다. 각 분류 셀은 네 개로 나뉘지만 새 관측 정보가 생기지는 않습니다.</desc>
