<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" width="360" height="340" role="img" aria-labelledby="title desc">
<title id="title">향: 가장 낮아지는 방향</title>
<desc id="desc">북을 0도, 동을 90도로 두고 시계 방향으로 읽습니다. 남동쪽으로 가장 낮아지는 경사면의 향은 135도입니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#285f44"/></marker></defs>
<rect width="360" height="340" fill="#fbfcfa"/>
<g font-family="Malgun Gothic,Apple SD Gothic Neo,Arial,sans-serif"><path d="M 180 275 V 67" fill="none" stroke="#cbd8cb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 75 173 H 285" fill="none" stroke="#cbd8cb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="180" cy="173" r="85" fill="none" stroke="#cbd8cb" stroke-width="3"/><text x="180" y="38" font-size="23" fill="#172a20" text-anchor="middle" font-weight="400">북 0°</text><text x="316" y="181" font-size="23" fill="#172a20" text-anchor="middle" font-weight="400">동</text><text x="180" y="315" font-size="23" fill="#172a20" text-anchor="middle" font-weight="400">남 180°</text><text x="43" y="181" font-size="23" fill="#172a20" text-anchor="middle" font-weight="400">서</text><path d="M 138 131 L 237 230" fill="none" stroke="#285f44" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="138" cy="131" r="7" fill="#aa5b29" stroke="#fbfcfa" stroke-width="3"/><text x="100" y="101" font-size="22" fill="#aa5b29" text-anchor="middle" font-weight="400">높음</text><text x="266" y="268" font-size="22" fill="#285f44" text-anchor="middle" font-weight="400">낮음</text><path d="M 180 111 A 62 62 0 0 1 223.8 216.8" fill="none" stroke="#aa5b29" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="241" y="136" font-size="24" fill="#aa5b29" text-anchor="middle" font-weight="600">135°</text></g>
</svg>
