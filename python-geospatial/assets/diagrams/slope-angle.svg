<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" width="360" height="340" role="img" aria-labelledby="title desc">
<title id="title">경사도: 높이차와 수평거리</title>
<desc id="desc">수평거리 10m에서 1m 높아지는 단면은 10퍼센트 경사이고 각도는 약 5.71도입니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#285f44"/></marker></defs>
<rect width="360" height="340" fill="#fbfcfa"/>
<g font-family="Malgun Gothic,Apple SD Gothic Neo,Arial,sans-serif"><path d="M 46 222 L 286 198 L 286 222 Z" fill="#e4eee1" stroke="#285f44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 46 242 H 286" fill="none" stroke="#53635a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="166" y="274" font-size="23" fill="#172a20" text-anchor="middle" font-weight="400">수평거리 10m</text><path d="M 307 198 V 222" fill="none" stroke="#aa5b29" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="285" y="169" font-size="23" fill="#aa5b29" text-anchor="middle" font-weight="400">높이차 1m</text><path d="M 85 222 A 39 39 0 0 0 84.8 218.1" fill="none" stroke="#aa5b29" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="95" y="195" font-size="24" fill="#aa5b29" text-anchor="start" font-weight="400">θ ≈ 5.71°</text><text x="180" y="57" font-size="24" fill="#172a20" text-anchor="middle" font-weight="600">1 ÷ 10 × 100 = 10%</text><text x="180" y="99" font-size="28" fill="#aa5b29" text-anchor="middle" font-weight="600">10% ≠ 10°</text></g>
</svg>
