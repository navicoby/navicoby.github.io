<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" width="360" height="340" role="img" aria-labelledby="title desc">
<title id="title">03 · 유효한 셀만 계산</title>
<desc id="desc">가상 반사도 0.10과 0.50의 NDVI는 약 0.67입니다. SCL에서 구름으로 표시한 오른쪽 위 네 셀은 제외합니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#285f44"/></marker></defs>
<rect width="360" height="340" fill="#fbfcfa"/>
<g font-family="Malgun Gothic,Apple SD Gothic Neo,Arial,sans-serif"><text x="180" y="35" font-size="20" fill="#172a20" text-anchor="middle" font-weight="600">NDVI = (NIR − R) / (NIR + R)</text><text x="180" y="70" font-size="21" fill="#285f44" text-anchor="middle" font-weight="600">(0.50 − 0.10) / 0.60 = 0.67</text><rect x="100" y="100" width="40" height="40" rx="0" fill="#b2cc91" stroke="#cbd8cb" stroke-width="2"/><text x="120" y="127" font-size="24" fill="#285f44" text-anchor="middle" font-weight="600">·</text><rect x="140" y="100" width="40" height="40" rx="0" fill="#b2cc91" stroke="#cbd8cb" stroke-width="2"/><text x="160" y="127" font-size="24" fill="#285f44" text-anchor="middle" font-weight="600">·</text><rect x="180" y="100" width="40" height="40" rx="0" fill="#dce1e0" stroke="#cbd8cb" stroke-width="2"/><text x="200" y="127" font-size="24" fill="#53635a" text-anchor="middle" font-weight="600">×</text><rect x="220" y="100" width="40" height="40" rx="0" fill="#dce1e0" stroke="#cbd8cb" stroke-width="2"/><text x="240" y="127" font-size="24" fill="#53635a" text-anchor="middle" font-weight="600">×</text><rect x="100" y="140" width="40" height="40" rx="0" fill="#b2cc91" stroke="#cbd8cb" stroke-width="2"/><text x="120" y="167" font-size="24" fill="#285f44" text-anchor="middle" font-weight="600">·</text><rect x="140" y="140" width="40" height="40" rx="0" fill="#b2cc91" stroke="#cbd8cb" stroke-width="2"/><text x="160" y="167" font-size="24" fill="#285f44" text-anchor="middle" font-weight="600">·</text><rect x="180" y="140" width="40" height="40" rx="0" fill="#dce1e0" stroke="#cbd8cb" stroke-width="2"/><text x="200" y="167" font-size="24" fill="#53635a" text-anchor="middle" font-weight="600">×</text><rect x="220" y="140" width="40" height="40" rx="0" fill="#dce1e0" stroke="#cbd8cb" stroke-width="2"/><text x="240" y="167" font-size="24" fill="#53635a" text-anchor="middle" font-weight="600">×</text><rect x="100" y="180" width="40" height="40" rx="0" fill="#b2cc91" stroke="#cbd8cb" stroke-width="2"/><text x="120" y="207" font-size="24" fill="#285f44" text-anchor="middle" font-weight="600">·</text><rect x="140" y="180" width="40" height="40" rx="0" fill="#b2cc91" stroke="#cbd8cb" stroke-width="2"/><text x="160" y="207" font-size="24" fill="#285f44" text-anchor="middle" font-weight="600">·</text><rect x="180" y="180" width="40" height="40" rx="0" fill="#b2cc91" stroke="#cbd8cb" stroke-width="2"/><text x="200" y="207" font-size="24" fill="#285f44" text-anchor="middle" font-weight="600">·</text><rect x="220" y="180" width="40" height="40" rx="0" fill="#b2cc91" stroke="#cbd8cb" stroke-width="2"/><text x="240" y="207" font-size="24" fill="#285f44" text-anchor="middle" font-weight="600">·</text><rect x="100" y="220" width="40" height="40" rx="0" fill="#b2cc91" stroke="#cbd8cb" stroke-width="2"/><text x="120" y="247" font-size="24" fill="#285f44" text-anchor="middle" font-weight="600">·</text><rect x="140" y="220" width="40" height="40" rx="0" fill="#b2cc91" stroke="#cbd8cb" stroke-width="2"/><text x="160" y="247" font-size="24" fill="#285f44" text-anchor="middle" font-weight="600">·</text><rect x="180" y="220" width="40" height="40" rx="0" fill="#b2cc91" stroke="#cbd8cb" stroke-width="2"/><text x="200" y="247" font-size="24" fill="#285f44" text-anchor="middle" font-weight="600">·</text><rect x="220" y="220" width="40" height="40" rx="0" fill="#b2cc91" stroke="#cbd8cb" stroke-width="2"/><text x="240" y="247" font-size="24" fill="#285f44" text-anchor="middle" font-weight="600">·</text><text x="180" y="304" font-size="22" fill="#172a20" text-anchor="middle" font-weight="600">구름 셀 × → 분석에서 제외</text></g>
