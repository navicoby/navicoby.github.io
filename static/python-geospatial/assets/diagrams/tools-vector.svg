<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" width="360" height="340" role="img" aria-labelledby="title desc">
<title id="title">좌표와 도형을 가진 표</title>
<desc id="desc">공원·건물 벡터 파일을 GeoPandas 공간표로 읽고 Shapely로 거리와 겹침을 계산합니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#285f44"/></marker></defs>
<rect width="360" height="340" fill="#fbfcfa"/>
<g font-family="Malgun Gothic,Apple SD Gothic Neo,Arial,sans-serif"><rect x="36" y="20" width="288" height="72" rx="10" fill="#e4eee1" stroke="#285f44" stroke-width="2"/><text x="180" y="46" font-size="22" fill="#285f44" text-anchor="middle" font-weight="600">공원 · 건물 파일</text><text x="180" y="80" font-size="22" fill="#172a20" text-anchor="middle" font-weight="400">GeoPackage / GeoJSON</text><path d="M 180 94 V 123" fill="none" stroke="#285f44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="36" y="130" width="288" height="72" rx="10" fill="#e4eee1" stroke="#285f44" stroke-width="2"/><text x="180" y="156" font-size="22" fill="#285f44" text-anchor="middle" font-weight="600">GeoPandas</text><text x="180" y="190" font-size="22" fill="#172a20" text-anchor="middle" font-weight="400">속성표 + geometry</text><path d="M 180 204 V 233" fill="none" stroke="#285f44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="36" y="240" width="288" height="72" rx="10" fill="#e4eee1" stroke="#285f44" stroke-width="2"/><text x="180" y="266" font-size="22" fill="#285f44" text-anchor="middle" font-weight="600">Shapely</text><text x="180" y="300" font-size="22" fill="#172a20" text-anchor="middle" font-weight="400">도형 · 거리 · 교차</text></g>
</svg>
