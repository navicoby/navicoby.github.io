<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 690" width="360" height="690" role="img" aria-labelledby="title desc">
<title id="title">본문 TinyUNet의 실제 크기</title>
<desc id="desc">입력 4×16×16, Encoder 8×16×16, Pool과 Bottom 16×8×8, 확대 16×16×16을 거칩니다. Encoder의 8채널을 skip으로 연결해 24채널로 합친 뒤 8채널을 거쳐 2범주 점수를 출력합니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#285f44"/></marker></defs>
<rect width="360" height="690" fill="#fbfcfa"/>
<g font-family="Malgun Gothic,Apple SD Gothic Neo,Arial,sans-serif"><rect x="22" y="14" width="258" height="64" rx="9" fill="#dcebf0" stroke="#285f44" stroke-width="2"/><text x="151" y="37" font-size="22" fill="#285f44" text-anchor="middle" font-weight="600">입력</text><text x="151" y="69" font-size="22" fill="#172a20" text-anchor="middle" font-weight="400">4 × 16 × 16</text><path d="M 151 80 V 105" fill="none" stroke="#285f44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="22" y="112" width="258" height="64" rx="9" fill="#e4eee1" stroke="#285f44" stroke-width="2"/><text x="151" y="135" font-size="22" fill="#285f44" text-anchor="middle" font-weight="600">Encoder</text><text x="151" y="167" font-size="22" fill="#172a20" text-anchor="middle" font-weight="400">8 × 16 × 16</text><path d="M 151 178 V 203" fill="none" stroke="#285f44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="22" y="210" width="258" height="64" rx="9" fill="#e4eee1" stroke="#285f44" stroke-width="2"/><text x="151" y="233" font-size="22" fill="#285f44" text-anchor="middle" font-weight="600">Pool + Bottom</text><text x="151" y="265" font-size="22" fill="#172a20" text-anchor="middle" font-weight="400">16 × 8 × 8</text><path d="M 151 276 V 301" fill="none" stroke="#285f44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="22" y="308" width="258" height="64" rx="9" fill="#e4eee1" stroke="#285f44" stroke-width="2"/><text x="151" y="331" font-size="22" fill="#285f44" text-anchor="middle" font-weight="600">확대</text><text x="151" y="363" font-size="22" fill="#172a20" text-anchor="middle" font-weight="400">16 × 16 × 16</text><path d="M 151 374 V 399" fill="none" stroke="#285f44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="22" y="406" width="258" height="64" rx="9" fill="#f1ddc4" stroke="#285f44" stroke-width="2"/><text x="151" y="429" font-size="22" fill="#285f44" text-anchor="middle" font-weight="600">채널 합치기</text><text x="151" y="461" font-size="22" fill="#172a20" text-anchor="middle" font-weight="400">24 × 16 × 16</text><path d="M 151 472 V 497" fill="none" stroke="#285f44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="22" y="504" width="258" height="64" rx="9" fill="#e4eee1" stroke="#285f44" stroke-width="2"/><text x="151" y="527" font-size="22" fill="#285f44" text-anchor="middle" font-weight="600">Decoder</text><text x="151" y="559" font-size="22" fill="#172a20" text-anchor="middle" font-weight="400">8 × 16 × 16</text><path d="M 151 570 V 595" fill="none" stroke="#285f44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="22" y="602" width="258" height="64" rx="9" fill="#dcebf0" stroke="#285f44" stroke-width="2"/><text x="151" y="625" font-size="22" fill="#285f44" text-anchor="middle" font-weight="600">분류 점수 출력</text><text x="151" y="657" font-size="22" fill="#172a20" text-anchor="middle" font-weight="400">2 × 16 × 16</text><path d="M 282 144 H 328 V 438 H 282" fill="none" stroke="#285f44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="291" y="271" width="61" height="32" rx="2" fill="#fbfcfa" stroke="#fbfcfa" stroke-width="2"/><text x="322" y="294" font-size="20" fill="#285f44" text-anchor="middle" font-weight="600">skip</text></g>
</svg>
