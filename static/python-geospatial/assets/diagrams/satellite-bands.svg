<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" width="360" height="340" role="img" aria-labelledby="title desc">
<title id="title">01 · 반사도 준비</title>
<desc id="desc">동일 위치의 적색 B04와 근적외선 B08을 읽습니다. 계산 예의 보정된 반사도는 각각 0.10과 0.50입니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#285f44"/></marker></defs>
<rect width="360" height="340" fill="#fbfcfa"/>
<g font-family="Malgun Gothic,Apple SD Gothic Neo,Arial,sans-serif"><rect x="35" y="30" width="130" height="100" rx="10" fill="#f1ddc4" stroke="#aa5b29" stroke-width="2"/><rect x="195" y="30" width="130" height="100" rx="10" fill="#e4eee1" stroke="#285f44" stroke-width="2"/><text x="100" y="65" font-size="24" fill="#aa5b29" text-anchor="middle" font-weight="600">B04</text><text x="100" y="101" font-size="27" fill="#aa5b29" text-anchor="middle" font-weight="600">0.10</text><text x="260" y="65" font-size="24" fill="#285f44" text-anchor="middle" font-weight="600">B08</text><text x="260" y="101" font-size="27" fill="#285f44" text-anchor="middle" font-weight="600">0.50</text><text x="100" y="163" font-size="22" fill="#172a20" text-anchor="middle" font-weight="400">적색 · 10m</text><text x="260" y="163" font-size="22" fill="#172a20" text-anchor="middle" font-weight="400">근적외 · 10m</text><path d="M 180 184 V 229" fill="none" stroke="#285f44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="180" y="267" font-size="25" fill="#172a20" text-anchor="middle" font-weight="600">보정 후 반사도</text><text x="180" y="309" font-size="22" fill="#53635a" text-anchor="middle" font-weight="400">DN · offset 먼저 확인</text></g>
</svg>
