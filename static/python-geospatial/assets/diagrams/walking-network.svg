<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 365" width="360" height="365" role="img" aria-labelledby="title desc">
<title id="title">보행거리: 280m</title>
<desc id="desc">통행 가능한 길을 따라 160m와 120m 구간을 지나면 출입구까지 280m입니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#285f44"/></marker></defs>
<rect width="360" height="365" fill="#fbfcfa"/>
<g font-family="Malgun Gothic,Apple SD Gothic Neo,Arial,sans-serif"><rect x="20" y="18" width="320" height="292" rx="0" fill="#fbfcfa" stroke="#cbd8cb" stroke-width="2"/><rect x="122" y="131" width="62" height="52" rx="8" fill="#dcebf0" stroke="#34667b" stroke-width="2"/><text x="153" y="164" font-size="21" fill="#34667b" text-anchor="middle" font-weight="400">연못</text><path d="M 70 260 V 60 H 220" fill="none" stroke="#cbd8cb" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M 70 260 V 60 H 220" fill="none" stroke="#285f44" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="92" y="220" font-size="22" fill="#285f44" text-anchor="start" font-weight="400">160m</text><text x="145" y="44" font-size="22" fill="#285f44" text-anchor="middle" font-weight="400">120m</text><circle cx="70" cy="260" r="9" fill="#aa5b29" stroke="#fbfcfa" stroke-width="3"/><circle cx="220" cy="60" r="9" fill="#285f44" stroke="#fbfcfa" stroke-width="3"/><text x="110" y="293" font-size="22" fill="#aa5b29" text-anchor="middle" font-weight="400">출발</text><text x="265" y="93" font-size="22" fill="#285f44" text-anchor="middle" font-weight="400">출입구</text><text x="180" y="342" font-size="24" fill="#172a20" text-anchor="middle" font-weight="600">160 + 120 = 280m</text></g>
</svg>
