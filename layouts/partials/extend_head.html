{{- if .Params.math }}
<style>
.post-content code:not(.language-mermaid){background:transparent!important;color:inherit!important;padding:0!important;border:0!important;font-family:inherit!important;font-size:inherit!important}
.mjx-container{overflow-x:auto;overflow-y:hidden;max-width:100%}
</style>
<script>
window.MathJax = {
  tex: {
    inlineMath: [['\\(', '\\)'], ['$', '$']],
    displayMath: [['\\[', '\\]'], ['$$', '$$']],
    processEscapes: true
  },
  svg: { fontCache: 'global' }
};
</script>
<script defer id="MathJax-script" src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
{{- end }}
{{- if .Params.mermaid }}
<style>
.mermaid { margin: 2rem auto; text-align: center; overflow-x: auto; }
.post-content .mermaid svg { max-width: 100%; height: auto; }
.post-content .mermaid .nodeLabel, .post-content .mermaid .edgeLabel { color: #17201c !important; }
.post-content .mermaid .label-container { fill: #f5f6f2 !important; stroke: #d6ded8 !important; }
</style>
{{- end }}

{{- if .Params.mermaid }}
<script type="module">
window.__sfMermaidInit = true;
document.addEventListener('DOMContentLoaded', async () => {
  const { default: mermaid } = await import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs');
  mermaid.initialize({
    startOnLoad: false,
    securityLevel: 'loose',
    theme: document.documentElement.dataset.theme === 'dark' ? 'dark' : 'neutral'
  });
  for (const code of document.querySelectorAll('pre > code.language-mermaid')) {
    const pre = code.parentElement;
    const node = document.createElement('div');
    node.className = 'mermaid';
    node.textContent = code.textContent;
    pre.replaceWith(node);
  }
  await mermaid.run({ querySelector: '.mermaid' });
});
</script>
{{- end }}
