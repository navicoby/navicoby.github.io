{{- /* Set theory page Mermaid renderer; keep conditional to mermaid-enabled pages. */ -}}
{{- if .Params.mermaid }}
<script type="module">
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
mermaid.initialize({ startOnLoad: false, securityLevel: 'loose', theme: document.body.classList.contains('dark') ? 'dark' : 'default' });
for (const code of document.querySelectorAll('pre > code.language-mermaid')) {
  const pre = code.parentElement;
  const node = document.createElement('div');
  node.className = 'mermaid';
  node.textContent = code.textContent;
  pre.replaceWith(node);
}
await mermaid.run({ querySelector: '.mermaid' });
</script>
{{- end }}
