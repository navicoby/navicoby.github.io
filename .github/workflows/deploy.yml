name: Deploy Hugo to GitHub Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - name: Setup book builder Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install book rendering dependencies
        run: python -m pip install markdown-it-py==4.2.0 beautifulsoup4==4.14.3

      - name: Build Digital Landscape Architecture from author sources
        run: python scripts/build_digital_landscape.py

      - name: Check book sources, figures and navigation
        run: python tests/test_digital_landscape.py

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build
        run: hugo --minify

      - name: Apply shared site header and footer
        run: python3 scripts/apply_site_chrome.py --public public

      - name: Register Digital Landscape Architecture in Literature
        run: python scripts/build_digital_landscape.py --register-home public/index.html

      - name: Check script-dependent page controls
        run: python3 scripts/test_site_chrome.py

      - name: Publish latest research index
        run: python3 scripts/sync_research.py --public public

      - name: Check static page navigation
        run: python3 scripts/check_static_navigation.py --public public

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
